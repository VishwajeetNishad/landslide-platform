# ============================================================
# environment.yml  --  ML side (Rudra) ka Python environment
#
# Banane ke liye:   conda env create -f environment.yml
# Activate:         conda activate landslide
# Update:           conda env update -f environment.yml --prune
#
# KYUN ye file: conda environment khud 2+ GB ka hota hai aur har machine
# par alag banta hai, isliye woh GitHub par nahi jaata. Ye chhoti si
# "recipe" file jaati hai, jisse koi bhi exactly same env bana leta hai.
# Isko "reproducibility" kehte hain.
#
# NOTE (V2 mein badla): backend ab Node.js hai, Python nahi. Isliye
# FastAPI/SQLAlchemy/Alembic ismein se hata diye -- woh ab
# backend/package.json mein hain. Ye env ab SIRF ml/ folder ke liye hai.
# ============================================================
name: landslide

channels:
  # conda-forge sabse pehle -- geospatial packages iske sabse behtar hain
  - conda-forge

dependencies:
  # ---------- Python ----------
  # 3.11 fix hai. 3.14 par GDAL/rasterio/geopandas ke pre-built wheels
  # nahi hain -> pip source se compile karega -> Windows par fail.
  - python=3.11

  # ---------- Geospatial core (conda se, pip se NAHI) ----------
  # Ye C/C++ libraries hain. pip inko Windows par theek se install nahi
  # kar sakta. Mixing karne par "DLL load failed" error aata hai.
  - gdal
  - rasterio
  - geopandas
  - shapely
  - pyproj
  - rioxarray
  - xarray

  # ---------- Terrain / hydrology ----------
  # WhiteboxTools: DEM conditioning, flow accumulation, watershed,
  # Hillslopes -> hamare slope units. GRASS install kiye bina.
  - whitebox

  # ---------- ML ----------
  - lightgbm
  - scikit-learn

  # ---------- Baaki (pure Python) pip se ----------
  - pip
  - pip:
      # --- Explainability ---
      # SHAP: har alert ke liye "ye kyun fire hua" ka jawab.
      # Official trust ke liye ye optional nahi hai.
      - shap>=0.46

      # --- Detection path (post-event mapping) ---
      - ultralytics>=8.3

      # --- Rudra ka output backend ko bhejne ke liye ---
      - requests>=2.32

      # --- Testing ---
      - pytest>=8.3

      # --- Lint ---
      - ruff>=0.7

# ============================================================
# NOTE Rudra ke liye:
#
# PyTorch ismein jaan-boojh kar nahi hai -- conda se woh bahut bada
# download karta hai. Env banane ke baad ye alag chalao:
#
#   conda activate landslide
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#
# CPU version hi kaafi hai -- teen-tank model chhota hai, GPU ki
# zarurat nahi.
#
# GOLDEN RULE: geo packages (gdal, rasterio, geopandas, shapely, pyproj)
# KABHI pip se mat install karna. Conda se hi aayenge. Mix karne par
# "DLL load failed" aata hai jo debug karna bahut painful hai.
# ============================================================
